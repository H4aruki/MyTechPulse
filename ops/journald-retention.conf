# 本番ホストの journald に、コンテナログを最低 30 日残させる設定（drop-in）。
# 置き場所: /etc/systemd/journald.conf.d/90-mytechpulse-retention.conf
# 決定: docs/adr/0014-keep-container-logs-30-days-in-journald.md
# 手順: docs/deploy/lightsail-provisioning.md の 6-2、docs/deploy/logging-and-monitoring.md の 2 章
#
# まだ本番には適用していない。適用には、ホストの journald の再読み込み
# （sudo systemctl restart systemd-journald）と、Docker のログドライバの切り替え
# （ops/docker-daemon.journald.json）、Docker の再起動、対象コンテナの作り直しが要る。
[Journal]
# 古いログを消す日数。30 日より前には、日数の理由では消さない
MaxRetentionSec=30day
# journald はファイル単位で消す。1 ファイルを 1 日分にして、消える単位を 1 日にする
MaxFileSec=1day
# 安全弁。通常の 30 日分は数十 MB 程度の見積もり（実測ではない）なので、普段は日数が先に効く。
# エラーが回り続けたときだけ、日数より前にサイズで消える
SystemMaxUse=1G
