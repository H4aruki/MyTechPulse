services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # このDBはコンテナ初回起動時に自動作成される（init_db.py はテーブル作成のみを担当）
      POSTGRES_DB: mytechpulse
    # ローカルでuvicornを直接動かす開発方法のために公開する。
    # 外部へ晒さないよう必ずループバックに束縛する（0.0.0.0にするとVPSでDBが世界に開く）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mytechpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # DATABASE_URL は host を db に上書き（backend/.env の localhost 版より優先される）
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mytechpulse"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- 任意（案B）: 静的フロント配信。`docker compose --profile frontend up` で有効化 ----
  # 事前に `cd frontend && npm install && npm run build` で dist/ を生成しておくこと。
  # 使う場合は frontend/.env の VITE_API_BASE_URL（ビルド時に埋め込まれる）と
  # backend/app/main.py の CORS 調整が必要。
  # SPAの深いリンク（/app/login 等）を直接開くには nginx 側にも rewrite が必要
  # （frontend/public/_redirects はNetlify/Cloudflare Pages用でnginxは解釈しない）。
  # frontend:
  #   image: nginx:alpine
  #   profiles: ["frontend"]
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./frontend/dist:/usr/share/nginx/html:ro
  #   depends_on:
  #     - api

volumes:
  db_data:
