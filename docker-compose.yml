services:
  db:
    image: postgres:17-alpine
    # サーバー再起動後に自動で復帰させる（本番はこれが無いと落ちたまま気付けない）
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # このDBはコンテナ初回起動時に自動作成される（init_db.py はテーブル作成のみを担当）
      POSTGRES_DB: mytechpulse
    # ローカルでuvicornを直接動かす開発方法のために公開する。
    # 外部へ晒さないよう必ずループバックに束縛する（0.0.0.0にするとVPSでDBが世界に開く）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mytechpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # release bundleや検査環境には秘密の設定ファイルを入れないため、無くても
    # composeの読み込み自体は通す（api-goのpullや構文確認が止まらないように）。
    # ファイルがある環境では、これまでと同じ内容が渡る
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # DATABASE_URL は host を db に上書き（backend/.env の localhost 版より優先される）
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mytechpulse"
    # 外部への公開は caddy が443で受けて中継する。ここはローカルからの疎通確認用に
    # ループバックだけへ公開する（0.0.0.0だとTLS無しのAPIが直接晒される）
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- Go版API（移行中の並行起動）。既定では起動しない ----
  # 起動: docker compose --env-file server/.env --profile go-preview up -d api-go
  # 既存の api（Python版, 8000番）とは別ポート(8001)で併存する。Caddyの接続先はまだ切り替えない
  api-go:
    profiles: ["go-preview"]
    # ローカルでは未指定のままbuildして使う。本番は ops/deploy_release.sh が
    # manifestのdigest（ghcr.io/...@sha256:...）を GO_API_IMAGE へ入れ、再buildせずpullして使う
    image: ${GO_API_IMAGE:-mytechpulse-api-go:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mytechpulse
      QIITA_ACCESS_TOKEN: ${QIITA_ACCESS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    # サーバー再起動後に自動で復帰させる（Python版の api と同じ）。止めたときは止まったままになる
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy

  # ---- Go版のDBマイグレーション（切り替えの当日に1回だけ実行。常駐しない）----
  # 実行: docker compose --profile go-migrate run --rm migrate-go
  # api-go と同じ箱（GO_API_IMAGE）の /migrate を使う。追加するだけの変更で、既存の3表には触れない
  migrate-go:
    profiles: ["go-migrate"]
    image: ${GO_API_IMAGE:-mytechpulse-api-go:local}
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mytechpulse
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---- HTTPS終端（本番のみ）。ローカル開発では起動しない ----
  # 起動: docker compose --profile prod up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      # ルートの .env で指定する（例: API_DOMAIN=api.mytechpulse.net）。
      # 未設定だと caddy は起動時に落ちる。ここで `:?` による必須チェックを使わないのは、
      # composeの変数展開がプロファイル外のサービスにも走り、ローカルの
      # `docker compose up -d db` まで巻き添えで失敗するため
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3。UDPを開けないと対応ブラウザで無駄な待ちが入ることがある
      - "443:443/udp"
    volumes:
      # 向け先の設定は MTP_CADDYFILE（このfileから見た相対path）で選ぶ。既定は Python版向けの Caddyfile。
      # Go版への切り替えでは ops/caddy/Caddyfile.maintenance や ops/caddy/Caddyfile.go を指定する（#127）。
      # 先頭に ./ を付けるのは、./ や / が無いと、composeがfileでなく名前付きvolumeと解釈するため
      - ./${MTP_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      # 取得済み証明書の保存先。消すと再取得になりレート制限に近づくので消さない
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # ---- 任意（案B）: 静的フロント配信。`docker compose --profile frontend up` で有効化 ----
  # 事前に `cd frontend && npm install && npm run build` で dist/ を生成しておくこと。
  # 使う場合は frontend/.env の VITE_API_BASE_URL（ビルド時に埋め込まれる）と
  # backend/app/main.py の CORS 調整が必要。
  # SPAの深いリンク（/app/login 等）を直接開くには nginx 側にも rewrite が必要
  # （frontend/public/_redirects はNetlify/Cloudflare Pages用でnginxは解釈しない）。
  # frontend:
  #   image: nginx:alpine
  #   profiles: ["frontend"]
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./frontend/dist:/usr/share/nginx/html:ro
  #   depends_on:
  #     - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
