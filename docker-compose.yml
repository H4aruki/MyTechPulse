services:
  db:
    image: postgres:17-alpine
    # サーバー再起動後に自動で復帰させる（本番はこれが無いと落ちたまま気付けない）
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # このDBはコンテナ初回起動時に自動作成される（テーブルは migrate が作る）
      POSTGRES_DB: mytechpulse
    # ローカルでGo APIを直接動かす開発方法のために公開する。
    # 外部へ晒さないよう必ずループバックに束縛する（0.0.0.0にするとVPSでDBが世界に開く）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mytechpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Go版API。既定では起動しない ----
  # 本番: 自動デプロイ（ops/deploy_go.sh）が、manifestのdigest（ghcr.io/...@sha256:...）を GO_API_IMAGE へ入れ、
  #       再buildせずpullして、--profile go-preview で起動する。
  # ローカル: 通常は dev.ps1 が `go run` で起動する。コンテナで動かすときは、
  #   docker compose --env-file server/.env --profile go-preview up -d api-go
  api-go:
    profiles: ["go-preview"]
    # ローカルでは未指定のままbuildして使う
    image: ${GO_API_IMAGE:-mytechpulse-api-go:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mytechpulse
      QIITA_ACCESS_TOKEN: ${QIITA_ACCESS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    # サーバー再起動後に自動で復帰させる。止めたときは止まったままになる
    restart: unless-stopped
    # 外部への公開は caddy が443で受けて中継する。ここはローカルからの疎通確認用に
    # ループバックだけへ公開する（0.0.0.0だとTLS無しのAPIが直接晒される）
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy

  # ---- Go版のDBマイグレーション（常駐しない）----
  # 実行: docker compose --profile go-migrate run --rm migrate-go
  # 本番では、自動デプロイが、入れ替えの前に実行する。api-go と同じ箱（GO_API_IMAGE）の /migrate を使う。
  # 追加するだけの変更に限る（直前のAPIへ戻ったとき、DBは巻き戻らないため）
  migrate-go:
    profiles: ["go-migrate"]
    image: ${GO_API_IMAGE:-mytechpulse-api-go:local}
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mytechpulse
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---- HTTPS終端（本番のみ）。ローカル開発では起動しない ----
  # 起動: docker compose --profile prod up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      # ルートの .env で指定する（例: API_DOMAIN=api.mytechpulse.net）。
      # 未設定だと caddy は起動時に落ちる。ここで `:?` による必須チェックを使わないのは、
      # composeの変数展開がプロファイル外のサービスにも走り、ローカルの
      # `docker compose up -d db` まで巻き添えで失敗するため
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3。UDPを開けないと対応ブラウザで無駄な待ちが入ることがある
      - "443:443/udp"
    volumes:
      # 向け先の設定は MTP_CADDYFILE（このfileから見た相対path）で選ぶ。既定は Go版向けの Caddyfile。
      # メンテナンス応答（503）にしたいときは ops/caddy/Caddyfile.maintenance を指定する。
      # 先頭に ./ を付けるのは、./ や / が無いと、composeがfileでなく名前付きvolumeと解釈するため
      - ./${MTP_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      # 取得済み証明書の保存先。消すと再取得になりレート制限に近づくので消さない
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
