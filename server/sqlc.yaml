version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/store/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        rename:
          user_ID: UserID
          tag_ID: TagID
        overrides: []
