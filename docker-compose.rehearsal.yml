# Go版への切り替えを本番と切り離して事前検証するための、使い捨て環境（#126）。
#
# 本番のdocker-compose.ymlとは別のproject・別のvolume・別のportで動き、本番のDB・
# Caddy・証明書には触れない。buildはせず、検証済みmanifestのdigestで指定したimageだけを使う。
# 起動と停止の手順は ops/rehearsal.sh と docs/deploy/go-migration-rehearsal.md を参照。
#
# 起動の段階（profile）
#   指定なし  : db だけ。ここへ暗号化backupの復号結果を復元する
#   migrate   : 同じdigestのimageでmigrationを1回だけ実行する
#   serve     : API と、frontend配信用のCaddy
#   legacy    : 切り戻しの模擬用。直前のrelease（Python版）のAPIを、同じDBへ向けて起動する
#
# 必須の環境変数
#   MTP_REHEARSAL_IMAGE         ghcr.io/...@sha256:... の完全digest（latestやtagでは使わない）
#   MTP_REHEARSAL_DB_PASSWORD   隔離DBだけのpassword。本番のpasswordを使い回さない
#   MTP_REHEARSAL_FRONTEND_DIR  hashを照合して展開したfrontendのdirectory
#   composeはprofile外のserviceの変数も展開するため、dbだけ起動するときも3つとも必要
# 任意の環境変数
#   MTP_REHEARSAL_DB_NAME       migrationとAPIが使うDB名。既定は mytechpulse。
#                               復元は新しいDB名へ行い、その名前をここへ渡す（同じvolumeに別DBを足す）
#   MTP_REHEARSAL_LEGACY_IMAGE  legacy profile で起動する直前のreleaseのAPI image
name: mytechpulse-rehearsal

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MTP_REHEARSAL_DB_PASSWORD:?隔離DB用のpasswordを指定してください}
      POSTGRES_DB: mytechpulse
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mytechpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    profiles: ["migrate"]
    image: ${MTP_REHEARSAL_IMAGE:?検証済みmanifestの完全digestを指定してください}
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${MTP_REHEARSAL_DB_PASSWORD:?}@db:5432/${MTP_REHEARSAL_DB_NAME:-mytechpulse}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["serve"]
    image: ${MTP_REHEARSAL_IMAGE:?検証済みmanifestの完全digestを指定してください}
    environment:
      APP_ENV: ${MTP_REHEARSAL_APP_ENV:-test}
      DATABASE_URL: postgresql://postgres:${MTP_REHEARSAL_DB_PASSWORD:?}@db:5432/${MTP_REHEARSAL_DB_NAME:-mytechpulse}
      # 実際のQiitaには本物のtokenを渡さない。無効なtokenなら、feedは部分成功で応答する
      QIITA_ACCESS_TOKEN: ${MTP_REHEARSAL_QIITA_ACCESS_TOKEN:-rehearsal-placeholder-token}
      CORS_ALLOWED_ORIGINS: ${MTP_REHEARSAL_ORIGIN:-https://localhost:18443}
      SWAGGER_ENABLED: ${MTP_REHEARSAL_SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:18001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # 切り戻しの模擬。直前のrelease（Python版）のAPIを、migration後の同じDBへ向けて起動する。
  # 画面側（旧frontend）は本番ではCloudflare Pagesのため、ここでは起動せず、人間がブラウザで確かめる
  api-legacy:
    profiles: ["legacy"]
    image: ${MTP_REHEARSAL_LEGACY_IMAGE:-mytechpulse-rehearsal-legacy-not-set}
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${MTP_REHEARSAL_DB_PASSWORD:?}@db:5432/${MTP_REHEARSAL_DB_NAME:-mytechpulse}
      QIITA_ACCESS_TOKEN: ${MTP_REHEARSAL_QIITA_ACCESS_TOKEN:-rehearsal-placeholder-token}
      SECRET_KEY: rehearsal-only-secret-key-not-used-in-production
      CORS_ALLOWED_ORIGINS: ${MTP_REHEARSAL_ORIGIN:-https://localhost:18443}
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # frontendを配信し、/api と /health を隔離APIへ中継する。
  # 本番のCaddyfileは使わず、証明書は使い捨ての内部CA（保存しないのでvolumeを持たない）
  caddy:
    profiles: ["serve"]
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      MTP_REHEARSAL_SITE: ${MTP_REHEARSAL_SITE:-localhost}
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - type: bind
        source: ${MTP_REHEARSAL_FRONTEND_DIR:?hash照合済みfrontendのdirectoryを指定してください}
        target: /srv/frontend
        read_only: true
    tmpfs:
      - /data
      - /config
    configs:
      - source: rehearsal_caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - api
    restart: "no"

configs:
  rehearsal_caddyfile:
    content: |
      {
      	auto_https disable_redirects
      }

      {$$MTP_REHEARSAL_SITE} {
      	tls internal
      	root * /srv/frontend

      	handle /api/* {
      		reverse_proxy api:8001
      	}
      	handle /health/* {
      		reverse_proxy api:8001
      	}
      	# SPAの深いリンクは、拡張子の無いものだけアプリ本体へ差し戻す
      	@spa path_regexp spa ^/app(/[^.]*)?$$
      	handle @spa {
      		rewrite * /app.html
      		file_server
      	}
      	handle {
      		file_server
      	}
      }

volumes:
  db:
    name: mytechpulse_rehearsal_db
