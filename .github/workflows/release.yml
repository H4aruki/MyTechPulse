name: Release artifacts

on:
  # GHCRの公開範囲・認証の承認前にimageを送らないため、手動実行のみにしている。
  # 承認後に main への push を追加する（#125 Task 4 Step 1）。
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and verify release artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: GHCRへログイン
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Go API imageをcommit SHAでbuild・push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/h4aruki/mytechpulse-api-go:${{ github.sha }}

      - name: digestで固定したimageをpullして検査
        env:
          API_IMAGE: ghcr.io/h4aruki/mytechpulse-api-go@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$API_IMAGE"
          bash scripts/check-go-image.sh "$API_IMAGE"

      - name: frontendを検査して一度だけbuild
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.mytechpulse.net
        run: |
          npm ci
          npm run api:check
          npm run lint
          npm run test
          npm run build

      - name: 3成果物とmanifestを作成
        env:
          API_IMAGE: ghcr.io/h4aruki/mytechpulse-api-go@${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$artifact_dir"

          frontend_file="frontend-${COMMIT_SHA}.tar.gz"
          ops_file="ops-${COMMIT_SHA}.tar.gz"
          tar -czf "$artifact_dir/$frontend_file" -C frontend/dist .

          mapfile -d '' tracked_ops_files < <(
            git ls-files -z -- docker-compose.yml Caddyfile ops docker-compose.rehearsal.yml
          )
          [ "${#tracked_ops_files[@]}" -gt 0 ]
          tar -czf "$artifact_dir/$ops_file" -- "${tracked_ops_files[@]}"

          node scripts/release-manifest.mjs create \
            --commit-sha "$COMMIT_SHA" \
            --api-image "$API_IMAGE" \
            --dir "$artifact_dir" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --repository "$REPOSITORY" \
            --server-url "$SERVER_URL" \
            --output "$artifact_dir/release-manifest.json" > "$RUNNER_TEMP/manifest-sha256"
          manifest_sha="$(cat "$RUNNER_TEMP/manifest-sha256")"
          echo "MTP_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"

      - name: frontend archiveを保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts/frontend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: ops archiveを保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ops-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts/ops-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: manifestとSHA256を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-artifacts/release-manifest.json
            ${{ runner.temp }}/release-artifacts/release-manifest.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: 成果物の識別情報を記録
        env:
          API_IMAGE: ghcr.io/h4aruki/mytechpulse-api-go@${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          {
            echo "## Release artifacts"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- API image: \`$API_IMAGE\`"
            echo "- Frontend artifact: \`frontend-$COMMIT_SHA\`"
            echo "- Ops artifact: \`ops-$COMMIT_SHA\`"
            echo "- Manifest artifact: \`release-manifest-$COMMIT_SHA-$RUN_ATTEMPT\`"
            echo "- Manifest SHA256: \`$MTP_MANIFEST_SHA256\`"
            echo "- Workflow run: $RUN_URL (ID $RUN_ID, attempt $RUN_ATTEMPT)"
            echo "- Retention: 90 days"
            echo "- Production deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
