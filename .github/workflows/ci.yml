name: CI

# 枝は絞らない。main 以外へのやりとりが素通りすると、
# 最後に main へ来たところで初めて問題が見つかることになるため。
#
# プルリクエストの更新も拾う。フォーク元の枝へのpushは、このリポジトリの
# pushイベントにならないため、synchronizeが無いと更新後の確認が抜ける。
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:

# 同じブランチに続けて push したときは、古い実行を打ち切る（実行時間の節約）。
# ただし main は打ち切らない。main の実行には公開の工程が含まれるので、
# 配信の途中で止められると中途半端な状態が残りかねないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 読み取りだけで足りる。既定より権限を絞っておく
permissions:
  contents: read

jobs:
  frontend-lint:
    name: フロントエンドの書き方チェック
    runs-on: ubuntu-latest
    # カバレッジの表をPRへコメントするためだけに、PRへの書き込みを許す
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci は package-lock.json のとおりに入れる（npm install と違い勝手に更新しない）
      - name: 依存の導入
        run: npm ci

      # Go側のAPI仕様（server/openapi/openapi.json）から作る型が古くなっていないかを確かめる
      - name: API型の生成差分を確認
        run: npm run api:check

      - name: 書き方チェック
        run: npm run lint

      # テストと同時にカバレッジも計測する（結果は frontend/coverage/ に出る）
      - name: 認証状態の画面動作を確認（カバレッジ計測つき）
        run: npm run test:coverage

      # 数値を実行画面の要約に出し、PRのときはコメントにも載せる。
      # 数値を見せるだけで、基準を下回っても落とさない。
      # コメント投稿に必要な書き込み権限はこの工程の前提として job に与えてある
      - name: カバレッジの表を作ってPRへ載せる
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -f frontend/coverage/coverage-summary.json || exit 0
          node scripts/coverage-report.mjs frontend frontend/coverage/coverage-summary.json "画面" > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            # フォークからのPRは書き込み権限が無いので、失敗しても検査は止めない
            bash scripts/post-pr-comment.sh coverage-comment.md || echo "コメント投稿は飛ばしました"
          fi

      # 組み立てが通るところまで確かめる。この命令は中で
      # 「型チェック → 組み立て」の順に走るので、型の検査も兼ねている。
      #
      # 型チェックだけだと、型は通るのに組み立てで落ちる変更がすり抜けて
      # main に入り、公開の工程で初めて落ちる（＝取り込みは止められず
      # 公開だけ止まる）。それを防ぐためここで組み立てまでやる
      - name: 型チェックと組み立て
        run: npm run build

  hooks-test:
    name: 設定まわりの仕掛けの確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # エージェント設定は Windows 上で書いているが、共同開発者の環境は
      # Mac や Linux のこともある。手元だけで確かめると、他の人の環境で初めて
      # 壊れていることが分かる。Linux 上でも動くことをここで確かめる。
      #
      # 追加の依存が無いので、依存の導入の手順は要らない。
      # 公開の工程（下の needs）には入れていない。設定まわりの不具合で
      # 本番公開まで止める必要はないため
      - name: 仕掛けの確認
        run: node --test ".claude/hooks/**/*.test.mjs" ".codex/hooks/**/*.test.mjs" "scripts/agent-harness/**/*.test.mjs"

      # 外部actionが40桁のcommit SHAで固定されているか、自動デプロイが意図した条件でだけ動くか、
      # 文書の相対リンクが切れていないか、現行の説明に旧構成の言葉が混ざっていないかを確かめる（どれもNode標準機能だけで動く）
      - name: 外部actionの固定・自動デプロイの条件・文書の整合を確認
        run: |
          node --test scripts/verify-actions-pinned.test.mjs scripts/coverage-report.test.mjs scripts/cutover-frontend.test.mjs scripts/deploy-needed.test.mjs scripts/verify-go-deploy-gated.test.mjs scripts/check-doc-links.test.mjs scripts/check-current-docs.test.mjs
          node scripts/verify-actions-pinned.mjs
          node scripts/check-doc-links.mjs
          node scripts/check-current-docs.mjs

  go-check:
    name: Goバックエンドの検査
    runs-on: ubuntu-latest
    # 本番の値やsecretは渡さない。pull-requests の書き込みは、
    # カバレッジの表をPRへコメントするためだけに使う
    permissions:
      contents: read
      pull-requests: write
    services:
      # DB結合テスト用の使い捨てDB。接続先は検査専用の合成値で、本番とは無関係
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: 形式・静的解析・テスト・build
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -race -cover | tee ../go-test.log
          go build ./cmd/api ./cmd/migrate ./cmd/openapi

      # 数値を見せるだけで、基準を下回っても落とさない
      - name: カバレッジの表を作ってPRへ載せる
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/coverage-report.mjs go go-test.log "Goサーバー" > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            bash scripts/post-pr-comment.sh coverage-comment.md || echo "コメント投稿は飛ばしました"
          fi

  go-generated:
    name: sqlcとOpenAPIの生成差分
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      # 生成物を作り直して、コミット済みの内容と違えば失敗にする。
      # 新規ファイルも見つけるため、git diff ではなく git status で比べる。
      #
      # server/db/queries（sqlcの入力）はDB問い合わせを実装するIssueで追加される。
      # まだ無い間はsqlcを飛ばしてOpenAPIだけ確かめ、追加された時点で自動的に検査対象になる
      - name: sqlcとOpenAPI生成差分
        working-directory: server
        run: |
          if [ -d db/queries ]; then
            go tool sqlc generate
          else
            echo "server/db/queries がまだ無いため、sqlcの確認は飛ばします"
          fi
          go run ./cmd/openapi
          changes="$(git status --porcelain -- internal/store/dbgen openapi/openapi.json)"
          if [ -n "$changes" ]; then
            echo "生成物がコミット内容と一致しません。再生成してコミットしてください。" >&2
            echo "$changes" >&2
            git --no-pager diff --stat -- internal/store/dbgen openapi/openapi.json >&2
            exit 1
          fi

  go-image:
    name: Go APIのimage検査
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # push せず、このjobの中へ読み込むだけ。キャッシュは使わず毎回作り直す
      - name: imageをbuild
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: mytechpulse-api-go:ci

      # 作った最終imageそのものを動かして確かめる（中身は scripts/check-go-image.sh）
      - name: 最終imageの起動・疎通・非root確認
        run: bash scripts/check-go-image.sh mytechpulse-api-go:ci

  # ---- Go版の自動デプロイ（#125）----
  # リポジトリ変数 GO_DEPLOY_ENABLED が 'true' のときだけ動く（未設定なら動かない）。
  # 止めたいときは、この変数を消すか 'false' にする。作る・消す操作は、オーナーが行う。
  # 流れ: 検査が全部成功した main の commit だけが、配布物の作成 → サーバーへの入れ替え → 画面の公開へ進む。
  # 入れ替えに失敗したときは、サーバー側（ops/deploy_go.sh）が、確認なしで直前の箱へ戻す。
  deploy-changes:
    name: 本番への反映が要るか
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 文書・試験だけの変更では、同じ箱を入れ替え直さない。比較できないときは、安全側に倒して反映する
      - name: 変更されたファイルから判定
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" --paginate --jq '.files[].filename')" &&
            [ "$(printf '%s\n' "$files" | grep -c .)" -lt 300 ]; then
            printf '%s\n' "$files" | node scripts/deploy-needed.mjs >> "$GITHUB_OUTPUT"
          else
            # 取得できない、または一覧が切り詰められている可能性がある
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  go-release:
    name: 配布物の作成
    needs: [frontend-lint, hooks-test, go-check, go-generated, go-image, deploy-changes]
    if: needs.deploy-changes.outputs.needed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml

  go-deploy:
    name: Go版の本番への反映
    needs: [go-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同時に2つの反映を走らせない。後から来たものは、先のものが終わるまで待つ（打ち切らない）
    concurrency:
      group: go-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_SHA256: ${{ needs.go-release.outputs.manifest_sha256 }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # この実行回の配布物を取り出し、manifestのSHA256（配布の工程が出力した値）と照合する
      - name: 配布物の取得と照合
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "manifestのSHA256を受け取れません" >&2; exit 2; }
          mkdir artifacts flat
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D artifacts \
            -p 'release-manifest-*' -p 'frontend-*' -p 'ops-*'
          find artifacts -type f -exec cp {} flat/ \;
          node scripts/release-manifest.mjs verify \
            --manifest flat/release-manifest.json \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --dir flat \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --commit-sha "$COMMIT_SHA"

      # 鍵は改行が壊れやすいので、1行の文字列にした状態で預けてある。ここで元のファイルに戻す。
      # つなぐ相手が本当に本番サーバーかを、控えた身元と照合する（サーバーを作り直すと値が変わる）
      - name: 鍵と接続先の用意
        env:
          SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN+as38LhXOjDSb2DP/yi8npPGDVwTiBwqw1okewupf6\n' "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 受け渡し用の作業場所（この自動デプロイが作るもの）だけを作り直して、配布物を送る
      - name: 配布物をサーバーへ送る
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LOGIN_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${opts[@]}" "$LOGIN_USER@$HOST" 'rm -rf -- "$HOME/deploy-in" "$HOME/deploy-boot" && mkdir -p "$HOME/deploy-in" "$HOME/deploy-boot"'
          scp "${opts[@]}" flat/frontend-*.tar.gz flat/ops-*.tar.gz flat/release-manifest.json "$LOGIN_USER@$HOST:deploy-in/"

      # 入れ替えは、サーバー側のスクリプトが行う。失敗したら、スクリプトが直前の箱へ戻し、この工程は失敗になる
      - name: サーバーでGo版を入れ替える
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LOGIN_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${opts[@]}" "$LOGIN_USER@$HOST" bash -s -- "$MANIFEST_SHA256" <<'REMOTE'
          set -euo pipefail
          tar -xzf "$HOME"/deploy-in/ops-*.tar.gz -C "$HOME/deploy-boot"
          bash "$HOME/deploy-boot/ops/deploy_go.sh" "$HOME/deploy-in" "$1"
          REMOTE

      # ここから画面。APIの入れ替えが成功したときだけ行う（画面が新しいAPIを前提にしているため）
      - name: いまの画面の公開の記録
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/cutover-frontend.mjs current | sed 's/^current_id=/before_id=/' | tee -a "$GITHUB_ENV"

      - name: 画面の展開
        run: |
          set -euo pipefail
          mkdir site
          tar -xzf "flat/frontend-${COMMIT_SHA}.tar.gz" -C site --no-same-owner --no-same-permissions
          test -f site/index.html
          test -f site/app.html
          test -f site/_redirects

      # 再ビルドせず、照合済みの成果物をそのまま公開する。--branch=main で本番の公開先として扱われる
      - name: Cloudflare Pages へ公開
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=mytechpulse --branch=main

      - name: 画面の公開後の確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/cutover-frontend.mjs after-publish "$before_id" | tee -a "$GITHUB_ENV"
          for url in https://mytechpulse.net/ https://mytechpulse.net/app https://api.mytechpulse.net/health/ready; do
            ok=0
            for _ in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null -m 10 "$url"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "公開後に $url へ届きません" >&2; exit 1; }
          done

      - name: 結果の記録
        if: always()
        run: |
          {
            echo "## Go版の本番への反映"
            echo "- commit: ${COMMIT_SHA}"
            echo "- 実行回: ${RUN_ID}"
            echo "- 画面の公開前の識別子（画面の切り戻し先）: ${before_id:-未取得}"
            echo "- 画面の公開後の識別子: ${current_id:-未公開}"
            echo "- APIの入れ替えと切り戻しの記録は、「サーバーでGo版を入れ替える」の出力（deploy: で始まる行）を見る"
          } >> "$GITHUB_STEP_SUMMARY"
