name: CI

# 枝は絞らない。main 以外へのやりとりが素通りすると、
# 最後に main へ来たところで初めて問題が見つかることになるため。
#
# プルリクエストの更新も拾う。フォーク元の枝へのpushは、このリポジトリの
# pushイベントにならないため、synchronizeが無いと更新後の確認が抜ける。
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:

# 同じブランチに続けて push したときは、古い実行を打ち切る（実行時間の節約）。
# ただし main は打ち切らない。main の実行には公開の工程が含まれるので、
# 配信の途中で止められると中途半端な状態が残りかねないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 読み取りだけで足りる。既定より権限を絞っておく
permissions:
  contents: read

jobs:
  backend-lint:
    name: バックエンドの書き方チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 本番コンテナ（backend/Dockerfile）と同じ 3.12 に合わせる
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # テストはアプリ本体を読み込むため、本番用と検査用の両方を入れる
      - name: チェック用ツールの導入
        run: pip install -r requirements.txt -r requirements-dev.txt

      # 判定基準は backend/pyproject.toml にある。
      # --output-format=github を付けると、指摘が差分の該当行に直接表示される
      - name: 明らかな誤りの検出
        run: ruff check backend --output-format=github

      # Python版の現行挙動を移行比較用に固定する。外部APIや実DBには接続しない。
      - name: Python版の移行互換を確認
        run: python -m pytest backend/tests/unit backend/tests/characterization -q

      # 見た目のズレは既存コードに多数あるため、いまは落とさず一覧だけ残す。
      # 一括で整え終えたら continue-on-error を外して必須に引き上げる
      - name: 見た目のズレを一覧表示（まだ必須にしない）
        continue-on-error: true
        run: ruff format --check --diff backend

  frontend-lint:
    name: フロントエンドの書き方チェック
    runs-on: ubuntu-latest
    # カバレッジの表をPRへコメントするためだけに、PRへの書き込みを許す
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci は package-lock.json のとおりに入れる（npm install と違い勝手に更新しない）
      - name: 依存の導入
        run: npm ci

      # Go側のAPI仕様（server/openapi/openapi.json）から作る型が古くなっていないかを確かめる
      - name: API型の生成差分を確認
        run: npm run api:check

      - name: 書き方チェック
        run: npm run lint

      # テストと同時にカバレッジも計測する（結果は frontend/coverage/ に出る）
      - name: 認証状態の画面動作を確認（カバレッジ計測つき）
        run: npm run test:coverage

      # 数値を実行画面の要約に出し、PRのときはコメントにも載せる。
      # 数値を見せるだけで、基準を下回っても落とさない。
      # コメント投稿に必要な書き込み権限はこの工程の前提として job に与えてある
      - name: カバレッジの表を作ってPRへ載せる
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -f frontend/coverage/coverage-summary.json || exit 0
          node scripts/coverage-report.mjs frontend frontend/coverage/coverage-summary.json "画面" > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            # フォークからのPRは書き込み権限が無いので、失敗しても検査は止めない
            bash scripts/post-pr-comment.sh coverage-comment.md || echo "コメント投稿は飛ばしました"
          fi

      # 組み立てが通るところまで確かめる。この命令は中で
      # 「型チェック → 組み立て」の順に走るので、型の検査も兼ねている。
      #
      # 型チェックだけだと、型は通るのに組み立てで落ちる変更がすり抜けて
      # main に入り、公開の工程で初めて落ちる（＝取り込みは止められず
      # 公開だけ止まる）。それを防ぐためここで組み立てまでやる
      - name: 型チェックと組み立て
        run: npm run build

  hooks-test:
    name: 設定まわりの仕掛けの確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # エージェント設定は Windows 上で書いているが、共同開発者の環境は
      # Mac や Linux のこともある。手元だけで確かめると、他の人の環境で初めて
      # 壊れていることが分かる。Linux 上でも動くことをここで確かめる。
      #
      # 追加の依存が無いので、依存の導入の手順は要らない。
      # 公開の工程（下の needs）には入れていない。設定まわりの不具合で
      # 本番公開まで止める必要はないため
      - name: 仕掛けの確認
        run: node --test ".claude/hooks/**/*.test.mjs" ".codex/hooks/**/*.test.mjs" "scripts/agent-harness/**/*.test.mjs"

      # 外部actionが40桁のcommit SHAで固定されているか、
      # 旧公開の凍結条件が外れていないかを確かめる（どちらもNode標準機能だけで動く）
      - name: 外部actionの固定と旧公開の凍結を確認
        run: |
          node --test scripts/verify-actions-pinned.test.mjs scripts/verify-legacy-deploy-frozen.test.mjs scripts/coverage-report.test.mjs
          node scripts/verify-actions-pinned.mjs

  go-check:
    name: Goバックエンドの検査
    runs-on: ubuntu-latest
    # 本番の値やsecretは渡さない。pull-requests の書き込みは、
    # カバレッジの表をPRへコメントするためだけに使う
    permissions:
      contents: read
      pull-requests: write
    services:
      # DB結合テスト用の使い捨てDB。接続先は検査専用の合成値で、本番とは無関係
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: 形式・静的解析・テスト・build
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -race -cover | tee ../go-test.log
          go build ./cmd/api ./cmd/migrate ./cmd/openapi

      # 数値を見せるだけで、基準を下回っても落とさない
      - name: カバレッジの表を作ってPRへ載せる
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/coverage-report.mjs go go-test.log "Goサーバー" > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            bash scripts/post-pr-comment.sh coverage-comment.md || echo "コメント投稿は飛ばしました"
          fi

  go-generated:
    name: sqlcとOpenAPIの生成差分
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      # 生成物を作り直して、コミット済みの内容と違えば失敗にする。
      # 新規ファイルも見つけるため、git diff ではなく git status で比べる。
      #
      # server/db/queries（sqlcの入力）はDB問い合わせを実装するIssueで追加される。
      # まだ無い間はsqlcを飛ばしてOpenAPIだけ確かめ、追加された時点で自動的に検査対象になる
      - name: sqlcとOpenAPI生成差分
        working-directory: server
        run: |
          if [ -d db/queries ]; then
            go tool sqlc generate
          else
            echo "server/db/queries がまだ無いため、sqlcの確認は飛ばします"
          fi
          go run ./cmd/openapi
          changes="$(git status --porcelain -- internal/store/dbgen openapi/openapi.json)"
          if [ -n "$changes" ]; then
            echo "生成物がコミット内容と一致しません。再生成してコミットしてください。" >&2
            echo "$changes" >&2
            git --no-pager diff --stat -- internal/store/dbgen openapi/openapi.json >&2
            exit 1
          fi

  go-image:
    name: Go APIのimage検査
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # push せず、このjobの中へ読み込むだけ。キャッシュは使わず毎回作り直す
      - name: imageをbuild
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: mytechpulse-api-go:ci

      # 作った最終imageそのものを動かして確かめる（中身は scripts/check-go-image.sh）
      - name: 最終imageの起動・疎通・非root確認
        run: bash scripts/check-go-image.sh mytechpulse-api-go:ci

  deploy-frontend:
    name: 画面の公開
    # 上の2つの書き方チェックが両方とも成功したときだけ動く。
    # どちらかが赤ければこの工程は実行されず、公開もされない
    needs: [backend-lint, frontend-lint]
    # main へ取り込まれたときだけ公開する。
    # 作業用の枝への push やプルリクエストでは動かさない。
    #
    # Go版への移行中は、旧画面・旧サーバーの自動公開を凍結している。
    # リポジトリ変数 LEGACY_DEPLOY_ENABLED が 'true' のときだけ動く（未設定なら動かない）。
    # この変数は作っていない。移行の本番切替が終わるまで作らないこと
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LEGACY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存の導入
        working-directory: frontend
        run: npm ci

      # 接続先のURLは組み立てのときに中へ埋め込まれるため、ここで渡す必要がある。
      # これまでは Cloudflare 側の設定画面に置いていたが、組み立てを GitHub 側へ
      # 移したことで Cloudflare 側の値は使われなくなる
      - name: 画面の組み立て
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.mytechpulse.net
        run: npm run build

      # 出来上がった一式（frontend/dist）を Cloudflare Pages へ送る。
      # --branch=main を付けることで、本番の公開先として扱われる
      - name: Cloudflare Pages へ公開
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=mytechpulse --branch=main

  deploy-backend:
    name: サーバーの反映
    # 画面の公開と同じ条件（凍結の理由は上の「画面の公開」を参照）。
    # 書き方チェックが両方とも緑のときだけ動く
    needs: [backend-lint, frontend-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LEGACY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 建て直しが詰まったまま待ち続けないよう上限を置く（通常は2〜3分で終わる）
    timeout-minutes: 15
    steps:
      # 鍵は改行が壊れやすいので、1行の文字列にした状態で預けてある。
      # ここで元のファイルに戻す
      - name: 鍵の用意
        env:
          SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # つなぐ相手が本当に本番サーバーかを、あらかじめ控えた身元と照合する。
          # 控えずに毎回相手の言い分を信じる書き方だと、なりすましに気づけない。
          #
          # サーバーを作り直すとこの値は変わる。そのときは接続できなくなるので、
          # 新しい値に書き換えること（取得方法: ssh-keyscan -t ed25519 <IP>）
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN+as38LhXOjDSb2DP/yi8npPGDVwTiBwqw1okewupf6\n' "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # サーバー上でやることは、いま手作業でやっているのと同じ2つ。
      # 本番の設定ファイル（.env）はGit管理の外にあるため、取り込みでは触られない
      - name: 最新を取り込んで建て直す
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LOGIN_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$LOGIN_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/MyTechPulse

          # --ff-only にしておくと、サーバー側に想定外の変更があるときは
          # 黙って混ぜずにその場で止まる
          git pull --ff-only

          docker compose up -d --build

          # 古い版が溜まるとディスクを圧迫する（本番は1GBプラン）
          docker image prune -f
          REMOTE

      # 建て直しの命令が通っても、中で落ちていれば意味がない。
      # 実際に応答が返るところまで見て初めて成功とみなす
      - name: 反映後にAPIが応答するか確認
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null -m 10 https://api.mytechpulse.net/; then
              echo "APIが応答した（${i}回目の確認）"
              exit 0
            fi
            echo "まだ応答しない。5秒待って確認し直す（${i}/10）"
            sleep 5
          done
          echo "時間切れ。APIが応答しないまま50秒が経過した"
          exit 1
