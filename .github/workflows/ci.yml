name: CI

# 枝は絞らない。main 以外へのやりとりが素通りすると、
# 最後に main へ来たところで初めて問題が見つかることになるため。
#
# プルリクエスト側を「作られたとき」だけに限っているのは、同じ確認を2回しないため。
# 枝が更新されたぶんは下の push が拾うので、プルリクエストの更新では動かさなくてよい。
# （push で出た結果はコミットに紐づくので、そのままプルリクエストの必須条件として扱われる）
on:
  pull_request:
    types: [opened, reopened]
  push:

# 同じブランチに続けて push したときは、古い実行を打ち切る（実行時間の節約）。
# ただし main は打ち切らない。main の実行には公開の工程が含まれるので、
# 配信の途中で止められると中途半端な状態が残りかねないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 読み取りだけで足りる。既定より権限を絞っておく
permissions:
  contents: read

jobs:
  backend-lint:
    name: バックエンドの書き方チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 本番コンテナ（backend/Dockerfile）と同じ 3.12 に合わせる
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # ruff はコードを読むだけで実行はしないため、アプリ本体の依存は入れなくてよい
      - name: チェック用ツールの導入
        run: pip install -r requirements-dev.txt

      # 判定基準は backend/pyproject.toml にある。
      # --output-format=github を付けると、指摘が差分の該当行に直接表示される
      - name: 明らかな誤りの検出
        run: ruff check backend --output-format=github

      # 見た目のズレは既存コードに多数あるため、いまは落とさず一覧だけ残す。
      # 一括で整え終えたら continue-on-error を外して必須に引き上げる
      - name: 見た目のズレを一覧表示（まだ必須にしない）
        continue-on-error: true
        run: ruff format --check --diff backend

  frontend-lint:
    name: フロントエンドの書き方チェック
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci は package-lock.json のとおりに入れる（npm install と違い勝手に更新しない）
      - name: 依存の導入
        run: npm ci

      - name: 書き方チェック
        run: npm run lint

      # 組み立てが通るところまで確かめる。この命令は中で
      # 「型チェック → 組み立て」の順に走るので、型の検査も兼ねている。
      #
      # 型チェックだけだと、型は通るのに組み立てで落ちる変更がすり抜けて
      # main に入り、公開の工程で初めて落ちる（＝取り込みは止められず
      # 公開だけ止まる）。それを防ぐためここで組み立てまでやる
      - name: 型チェックと組み立て
        run: npm run build

  deploy-frontend:
    name: 画面の公開
    # 上の2つの書き方チェックが両方とも成功したときだけ動く。
    # どちらかが赤ければこの工程は実行されず、公開もされない
    needs: [backend-lint, frontend-lint]
    # main へ取り込まれたときだけ公開する。
    # 作業用の枝への push やプルリクエストでは動かさない
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存の導入
        working-directory: frontend
        run: npm ci

      # 接続先のURLは組み立てのときに中へ埋め込まれるため、ここで渡す必要がある。
      # これまでは Cloudflare 側の設定画面に置いていたが、組み立てを GitHub 側へ
      # 移したことで Cloudflare 側の値は使われなくなる
      - name: 画面の組み立て
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.mytechpulse.net
        run: npm run build

      # 出来上がった一式（frontend/dist）を Cloudflare Pages へ送る。
      # --branch=main を付けることで、本番の公開先として扱われる
      - name: Cloudflare Pages へ公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=mytechpulse --branch=main

  deploy-backend:
    name: サーバーの反映
    # 画面の公開と同じ条件。書き方チェックが両方とも緑のときだけ動く
    needs: [backend-lint, frontend-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 建て直しが詰まったまま待ち続けないよう上限を置く（通常は2〜3分で終わる）
    timeout-minutes: 15
    steps:
      # 鍵は改行が壊れやすいので、1行の文字列にした状態で預けてある。
      # ここで元のファイルに戻す
      - name: 鍵の用意
        env:
          SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # つなぐ相手が本当に本番サーバーかを、あらかじめ控えた身元と照合する。
          # 控えずに毎回相手の言い分を信じる書き方だと、なりすましに気づけない。
          #
          # サーバーを作り直すとこの値は変わる。そのときは接続できなくなるので、
          # 新しい値に書き換えること（取得方法: ssh-keyscan -t ed25519 <IP>）
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN+as38LhXOjDSb2DP/yi8npPGDVwTiBwqw1okewupf6\n' "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # サーバー上でやることは、いま手作業でやっているのと同じ2つ。
      # 本番の設定ファイル（.env）はGit管理の外にあるため、取り込みでは触られない
      - name: 最新を取り込んで建て直す
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LOGIN_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$LOGIN_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/MyTechPulse

          # --ff-only にしておくと、サーバー側に想定外の変更があるときは
          # 黙って混ぜずにその場で止まる
          git pull --ff-only

          docker compose up -d --build

          # 古い版が溜まるとディスクを圧迫する（本番は1GBプラン）
          docker image prune -f
          REMOTE

      # 建て直しの命令が通っても、中で落ちていれば意味がない。
      # 実際に応答が返るところまで見て初めて成功とみなす
      - name: 反映後にAPIが応答するか確認
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null -m 10 https://api.mytechpulse.net/; then
              echo "APIが応答した（${i}回目の確認）"
              exit 0
            fi
            echo "まだ応答しない。5秒待って確認し直す（${i}/10）"
            sleep 5
          done
          echo "時間切れ。APIが応答しないまま50秒が経過した"
          exit 1
